<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyArch browser checks</title>
  <style>
    body { margin: 24px; background: #101720; color: #e9f0f7; font: 14px/1.6 system-ui, sans-serif; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    p { color: #8b9aaa; }
    li { margin: 7px 0; }
    .pass { color: #9ceacb; }
    .fail { color: #dd938e; }
    iframe { width: 1280px; height: 900px; border: 1px solid #ffffff18; border-radius: 12px; margin-top: 24px; }
    code { color: #b79edb; }
  </style>
  <script src="/tests/graph.test.js" defer></script>
</head>
<body>
  <h1>Orbital workspace · browser checks</h1>
  <p>Plain JavaScript tests running against the real interface. No Node.js, packages, or build tools.</p>
  <strong id="summary">Loading the workspace...</strong>
  <ol id="results"></ol>
  <iframe id="workspace-frame" src="/" title="Workspace under test"></iframe>
</body>
</html>
